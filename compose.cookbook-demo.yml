# Demo: serve https://cookbook.bunsenbrenner.org through the Browser Plane, with a real Let's
# Encrypt cert issued CORE-side via deSEC DNS-01 (#219) — the SAME publishing shape as
# examples/flappy-demo. A SEPARATE, parallel pipeline (its own bridge), not a reuse of the crew
# bridge (maintainer 2026-07-26). Optional demo subsystem: `up` to enable, `down` to take offline.
#
#   enable:   examples/cookbook-demo/run-demo.sh up
#   disable:  examples/cookbook-demo/run-demo.sh down
#
# cookbook-agent onboards as a remote agent against a control-plane/edge that does
# NOT have to run on this host (e.g. the hosted bunsenbrenner.org plane) —
# CT_AGENT_CP_URL/CT_AGENT_EDGE just need to be reachable over the network, so this
# stack only needs its own private compose network. Env comes from docker/deploy/.env.
services:
  cookbook-origin:
    # Plain Caddy: terminates TLS with a cert issued CORE-side (#219,
    # scripts/authorize-pipeline.sh) and mounted read-only below — no ACME
    # client or deSEC token in this container at all.
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    volumes:
      - ./index.html:/srv/index.html:ro
      # #168: the untracked gate.json (SHA-256 hash of the demo password only), generated by
      # run-demo.sh from the out-of-band COOKBOOK_DEMO_PASSWORD; never committed.
      - ./gate.json:/srv/gate.json:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # #219: fullchain.pem + privkey.pem, issued by the operator's
      # scripts/authorize-pipeline.sh and relayed out of band — never a
      # DESEC_TOKEN, never an ACME client running in this repo.
      - ${COOKBOOK_CERT_DIR:?set COOKBOOK_CERT_DIR=<dir with fullchain.pem+privkey.pem from the operator>}:/certs:ro
      - cookbook_caddy_data:/data
    expose:
      - "443"   # reachable only via the tunnel/agent, not published to the host
    restart: unless-stopped

  cookbook-agent:
    # The Browser-Plane agent (SNI passthrough), built from the standalone
    # scimbe/ct-agent repo via this repo's own Agent.Dockerfile -- see that
    # file's header comment. Previously built from a sibling CADS-Tunnel
    # checkout (docker/Dockerfile, CRATE=ct-agent), which stopped working
    # once ct-agent's source was extracted out of CADS-Tunnel core (same fix
    # already applied to CADS-flappy-demo's flappy-agent service).
    build:
      context: .
      dockerfile: Agent.Dockerfile
      args:
        # Keep in sync with CADS-flappy-demo/CADS-webconference-demo/
        # CADS-auction-demo's own Agent.Dockerfile CT_AGENT_REF. Was v0.4.8
        # since 2026-08-13 (ADMISSION_EXCHANGE_TIMEOUT 15s -> 45s); bumped to
        # v0.5.7 on 2026-09-02 to match a2a-demo/auction-demo. This default
        # here previously silently overrode the Dockerfile's own ARG default
        # (a real bug, not just a stale comment) -- keep both in sync by hand.
        - CT_AGENT_REF=${CT_AGENT_REF:-v0.7.24}
    environment:
      - CT_AGENT_MODE=browser
      - CT_AGENT_HOSTNAME=cookbook.bunsenbrenner.org
      - CT_AGENT_TOKEN=${COOKBOOK_AGENT_TOKEN:-}
      - CT_AGENT_ORIGIN=cookbook-origin:443
      - CT_AGENT_ORIGIN_PROTO=tcp
      - CT_AGENT_CAPABILITY_OUT=/tmp/capability.bin
      - CT_AGENT_EDGE=${COOKBOOK_AGENT_EDGE:?edge host:port, e.g. edge:4433}
      - CT_AGENT_CP_URL=${COOKBOOK_AGENT_CP_URL:?control-plane URL for onboarding}
      - CT_AGENT_JOIN_TOKEN=${COOKBOOK_JOIN_TOKEN:?single-use join token}
      - CT_AGENT_ID=cookbook-demo
      - CT_AGENT_EDGE_CERT_URL=${COOKBOOK_AGENT_EDGE_CERT_URL:-}
      # #141 restart-safety: persist onboarding so a restart restores the bound identity.
      - CT_AGENT_STATE_DIR=/var/lib/ct-agent
      # #36: retry the edge forever so a bounced edge is rejoined automatically.
      - CT_AGENT_RECONNECT_MAX_ATTEMPTS=0
    command: ["ct-agent", "onboard"]
    depends_on:
      - cookbook-origin
    restart: unless-stopped
    volumes:
      - cookbook_agent_state:/var/lib/ct-agent

  cookbook-crew-bridge:
    # #201: the cookbook pipeline's OWN bridge, the origin reverse-proxies POST /cookbook/build
    # here. Runs safety → structure → presentation → review over the real tunnel, one
    # COOKBOOK_*_CMD per role dialing its peer via `ct-agent channel` (CT_CHANNEL_CALL_SERVICE
    # mode). Each role needs its OWN channel identity (a different peer), so a single global
    # CT_CHANNEL_* can't serve all four — each CMD carries its role's identity via an `env …` prefix
    # ($$… = a literal $ so the bridge's own `sh -c` expands it at call time).
    #
    # Thin-bridge migration (#219): the HTTP server + wire-format assembly used to be
    # `ct-cookbook-bridge`, a binary built INSIDE CADS-Tunnel core. It's now plain Node
    # (bridge/server.js, this repo) — the generic `ct-agent` CLI (used by the COOKBOOK_*_CMD
    # role dials below) is built by bridge/Dockerfile itself, cloning scimbe/ct-agent directly
    # at a pinned ref (same fix as cookbook-agent's own Agent.Dockerfile above -- the old
    # `tunnel-src` additional build context into a sibling CADS-Tunnel checkout stopped working
    # once ct-agent's source was extracted out of CADS-Tunnel core).
    #
    # OPT-IN (per #194): only starts with `--profile crew`; the plain `up` runs the demo without it
    # (the page shows an "unreachable, try again" until the crew is live). The per-role vars DEFAULT
    # EMPTY (`:-`) so a missing one never breaks the whole stack's interpolation. Fill them (in
    # docker/deploy/.env) once central provisions the grants, then `--profile crew up`.
    profiles: ["crew"]
    build:
      context: .
      dockerfile: bridge/Dockerfile
      args:
        - CT_AGENT_REF=${CT_AGENT_REF:-v0.7.24}
    command: ["node", "server.js"]
    environment:
      - COOKBOOK_BRIDGE_LISTEN=0.0.0.0:8789
      - COOKBOOK_EDGE_BROKER=${COOKBOOK_EDGE_BROKER:-}
      - COOKBOOK_EDGE_RELAY=${COOKBOOK_EDGE_RELAY:-}
      # Per-role channel-join identities (operator-supplied from central's provisioning; SECRET hex).
      - COOKBOOK_SAFETY_GRANT=${COOKBOOK_SAFETY_GRANT:-}
      - COOKBOOK_SAFETY_HOLDER_KEY=${COOKBOOK_SAFETY_HOLDER_KEY:-}
      - COOKBOOK_SAFETY_NOISE_KEY=${COOKBOOK_SAFETY_NOISE_KEY:-}
      - COOKBOOK_STRUCTURE_GRANT=${COOKBOOK_STRUCTURE_GRANT:-}
      - COOKBOOK_STRUCTURE_HOLDER_KEY=${COOKBOOK_STRUCTURE_HOLDER_KEY:-}
      - COOKBOOK_STRUCTURE_NOISE_KEY=${COOKBOOK_STRUCTURE_NOISE_KEY:-}
      - COOKBOOK_PRESENTATION_GRANT=${COOKBOOK_PRESENTATION_GRANT:-}
      - COOKBOOK_PRESENTATION_HOLDER_KEY=${COOKBOOK_PRESENTATION_HOLDER_KEY:-}
      - COOKBOOK_PRESENTATION_NOISE_KEY=${COOKBOOK_PRESENTATION_NOISE_KEY:-}
      - COOKBOOK_REVIEW_GRANT=${COOKBOOK_REVIEW_GRANT:-}
      - COOKBOOK_REVIEW_HOLDER_KEY=${COOKBOOK_REVIEW_HOLDER_KEY:-}
      - COOKBOOK_REVIEW_NOISE_KEY=${COOKBOOK_REVIEW_NOISE_KEY:-}
      - "COOKBOOK_SAFETY_CMD=env CT_CHANNEL_ROLE=initiate CT_CHANNEL_CALL_SERVICE=safety_check CT_CHANNEL_BROKER=$$COOKBOOK_EDGE_BROKER CT_CHANNEL_RELAY=$$COOKBOOK_EDGE_RELAY CT_CHANNEL_RELAY_ONLY=1 CT_CHANNEL_GRANT=$$COOKBOOK_SAFETY_GRANT CT_CHANNEL_HOLDER_KEY=$$COOKBOOK_SAFETY_HOLDER_KEY CT_CHANNEL_NOISE_KEY=$$COOKBOOK_SAFETY_NOISE_KEY ct-agent channel"
      # #226 (workflow-pipelines side): no real standby structure server is actually running —
      # a COOKBOOK_STRUCTURE_CMD_2 candidate pointing at an unset COOKBOOK_STRUCTURE_STANDBY_GRANT
      # used to be defined unconditionally here. roleCandidates() only checks that the env var is
      # non-empty (the command template text always is), so it was ALWAYS added as a "real"
      # candidate regardless of whether its grant was actually configured — meaning any transient
      # failure on the real (only) structure server's single-attempt primary dial fell through to
      # this guaranteed-broken standby ("CT_CHANNEL_GRANT required") instead of getting its full
      # 5-attempt retry budget. Removed until a real standby structure server actually exists.
      - "COOKBOOK_STRUCTURE_CMD=env CT_CHANNEL_ROLE=initiate CT_CHANNEL_CALL_SERVICE=text_generation CT_CHANNEL_BROKER=$$COOKBOOK_EDGE_BROKER CT_CHANNEL_RELAY=$$COOKBOOK_EDGE_RELAY CT_CHANNEL_RELAY_ONLY=1 CT_CHANNEL_GRANT=$$COOKBOOK_STRUCTURE_GRANT CT_CHANNEL_HOLDER_KEY=$$COOKBOOK_STRUCTURE_HOLDER_KEY CT_CHANNEL_NOISE_KEY=$$COOKBOOK_STRUCTURE_NOISE_KEY ct-agent channel"
      - "COOKBOOK_PRESENTATION_CMD=env CT_CHANNEL_ROLE=initiate CT_CHANNEL_CALL_SERVICE=text_generation CT_CHANNEL_BROKER=$$COOKBOOK_EDGE_BROKER CT_CHANNEL_RELAY=$$COOKBOOK_EDGE_RELAY CT_CHANNEL_RELAY_ONLY=1 CT_CHANNEL_GRANT=$$COOKBOOK_PRESENTATION_GRANT CT_CHANNEL_HOLDER_KEY=$$COOKBOOK_PRESENTATION_HOLDER_KEY CT_CHANNEL_NOISE_KEY=$$COOKBOOK_PRESENTATION_NOISE_KEY ct-agent channel"
      - "COOKBOOK_REVIEW_CMD=env CT_CHANNEL_ROLE=initiate CT_CHANNEL_CALL_SERVICE=safety_check CT_CHANNEL_BROKER=$$COOKBOOK_EDGE_BROKER CT_CHANNEL_RELAY=$$COOKBOOK_EDGE_RELAY CT_CHANNEL_RELAY_ONLY=1 CT_CHANNEL_GRANT=$$COOKBOOK_REVIEW_GRANT CT_CHANNEL_HOLDER_KEY=$$COOKBOOK_REVIEW_HOLDER_KEY CT_CHANNEL_NOISE_KEY=$$COOKBOOK_REVIEW_NOISE_KEY ct-agent channel"
    expose:
      - "8789"   # reached only by the origin's reverse_proxy on the compose network
    depends_on:
      - cookbook-origin
    restart: unless-stopped

volumes:
  cookbook_caddy_data:
  cookbook_agent_state:

# This stack's own private network — sufficient when onboarding against a
# remote/hosted control-plane (e.g. bunsenbrenner.org). If the plane ever runs on
# THIS same host again, switch back to an external `ct-selfhost_default` network.
networks:
  default:
    name: cookbook-demo_default
